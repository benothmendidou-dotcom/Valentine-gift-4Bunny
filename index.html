<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Password to My Heart 💖</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #c0392b;
      text-align: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      margin: 10px;
      font-size: clamp(1.8em, 5vw, 2.5em);
    }
    canvas {
      border: 4px solid #e74c3c;
      background: #fff0f5;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(231,76,60,0.5);
      display: block;
      margin: 10px auto;
      max-width: 95%;
      max-height: 70vh;
      touch-action: none;
    }
    #winMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      background: rgba(255,255,255,0.95);
      padding: 40px 50px;
      border-radius: 25px;
      box-shadow: 0 0 40px rgba(255,105,180,0.7);
      font-size: clamp(1.6em, 5vw, 2.5em);
      color: #c0392b;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.7s ease-out, transform 0.7s ease-out, visibility 0s linear 0.7s;
      z-index: 100;
      max-width: 90%;
    }
    #winMessage.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
      transition-delay: 0s;
    }
    #closeBtn {
      position: absolute;
      top: 12px;
      right: 18px;
      font-size: 36px;
      font-weight: bold;
      color: #e74c3c;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s, transform 0.2s;
    }
    #closeBtn:hover {
      color: #c0392b;
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <h1>Password to My Heart... 💕</h1>
  <canvas id="gameCanvas"></canvas>
  <div id="winMessage">
    <button id="closeBtn">×</button>
    You hit 10 hearts! 🎯<br>
    You already own mine forever ❤️<br>
    I love you so much, [Her Name]!<br>
    Happy Valentine's from Mondher 😘
    <!-- Optional: <img src="images/us-photo.jpg" style="width:180px; border-radius:15px; margin-top:20px;"> -->
  </div>

  <script>
    // === PASSWORD PROTECTION ===
    const correctPassword = "iloveyou"; // CHANGE THIS to your special one
    let entered = prompt("What's the secret password to my heart? 💖\n(Hint: think of us!)");

    if (entered !== correctPassword) {
      alert("Not quite... try again! 🥺");
      location.reload();
    } else {
      alert("Yes! 💕 Now be Cupid & shoot 10 hearts with taps/drags!");
      startGame();
    }

    function startGame() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const winMsg = document.getElementById('winMessage');

      // Responsive canvas
      function resize() {
        canvas.width = Math.min(window.innerWidth * 0.95, 800);
        canvas.height = Math.min(window.innerHeight * 0.6, 500);
      }
      resize();
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', resize);

      // === CUSTOMIZABLE IMAGES (change filenames here) ===
      const cupidSrc     = 'cupid.png';          // Cupid character (facing right)
      const arrowSrc     = 'arrow.png';    // Heart-tipped arrow
      const heartSrc     = 'Red pixel heart.png';   // Floating target heart

      // Preload images with error logging
      const cupidImg = new Image();
      cupidImg.src = cupidSrc;
      cupidImg.onerror = () => console.error("Failed to load Cupid image:", cupidSrc);

      const arrowImg = new Image();
      arrowImg.src = arrowSrc;
      arrowImg.onerror = () => console.error("Failed to load Arrow image:", arrowSrc);

      const heartImg = new Image();
      heartImg.src = heartSrc;
      heartImg.onerror = () => console.error("Failed to load Heart image:", heartSrc);

      let score = 0;
      const goal = 10;
      let arrows = [];
      let hearts = [];

      const cupid = { x: 80, y: canvas.height / 2, size: 80 };

      let aim = { x: canvas.width / 2, y: canvas.height / 2 };

      // Aim & shoot (mouse + touch)
      function updateAim(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0]?.clientX);
        const clientY = e.clientY || (e.touches && e.touches[0]?.clientY);
        aim.x = clientX - rect.left;
        aim.y = clientY - rect.top;
      }

      function shoot(e) {
        e.preventDefault();
        updateAim(e);
        const angle = Math.atan2(aim.y - cupid.y, aim.x - (cupid.x + cupid.size));
        const speed = 12;
        arrows.push({
          x: cupid.x + cupid.size,
          y: cupid.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          rotation: angle
        });
      }

      canvas.addEventListener('mousemove', updateAim);
      canvas.addEventListener('mousedown', shoot);
      canvas.addEventListener('touchmove', updateAim, { passive: false });
      canvas.addEventListener('touchstart', shoot, { passive: false });

      // Target Heart
      class Heart {
        constructor() {
          this.x = canvas.width + 50;
          this.y = Math.random() * (canvas.height - 100) + 50;
          this.size = 60 + Math.random() * 30;
          this.speed = 2 + Math.random() * 3;
        }
        update() { this.x -= this.speed; }
        draw() {
          if (heartImg.complete && heartImg.naturalHeight !== 0) {
            ctx.drawImage(heartImg, this.x - this.size/2, this.y - this.size/2, this.size, this.size);
          } else {
            // fallback
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.bezierCurveTo(this.x + this.size/2, this.y - this.size/2, this.x + this.size, this.y + this.size/3, this.x, this.y + this.size);
            ctx.bezierCurveTo(this.x - this.size, this.y + this.size/3, this.x - this.size/2, this.y - this.size/2, this.x, this.y);
            ctx.fillStyle = '#ff3366';
            ctx.fill();
          }
        }
      }

      setInterval(() => hearts.push(new Heart()), 1200);

      // Close win message
      document.getElementById('closeBtn').addEventListener('click', () => {
        winMsg.classList.remove('show');
      });

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Cupid
        if (cupidImg.complete && cupidImg.naturalHeight !== 0) {
          ctx.drawImage(cupidImg, cupid.x, cupid.y - cupid.size/2, cupid.size, cupid.size);
        } else {
          ctx.fillStyle = 'pink';
          ctx.fillRect(cupid.x, cupid.y - cupid.size/2, cupid.size, cupid.size);
          ctx.fillStyle = '#ff69b4';
          ctx.beginPath();
          ctx.arc(cupid.x + cupid.size/2, cupid.y - cupid.size/3, cupid.size/4, 0, Math.PI*2);
          ctx.fill();
        }

        // Bow
        ctx.beginPath();
        ctx.moveTo(cupid.x + cupid.size, cupid.y);
        ctx.lineTo(aim.x, aim.y);
        ctx.strokeStyle = 'brown';
        ctx.lineWidth = 5;
        ctx.stroke();

        // Arrows
        arrows = arrows.filter(a => {
          a.x += a.vx;
          a.y += a.vy;

          if (arrowImg.complete && arrowImg.naturalHeight !== 0) {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.rotation);
            ctx.drawImage(arrowImg, -25, -12.5, 50, 25); // adjust size/offset if needed
            ctx.restore();
          } else {
            ctx.fillStyle = 'red';
            ctx.fillRect(a.x - 10, a.y - 5, 30, 10);
          }

          return a.x < canvas.width + 100 && a.y > -50 && a.y < canvas.height + 50;
        });

        // Hearts + collisions
        hearts = hearts.filter(h => {
          h.update();
          h.draw();

          let hit = false;
          arrows.forEach((a, ai) => {
            const dx = a.x - h.x;
            const dy = a.y - h.y;
            if (Math.hypot(dx, dy) < h.size / 1.5) {
              score++;
              hit = true;
              arrows.splice(ai, 1);
              if (score >= goal) {
                winMsg.classList.add('show');
              }
            }
          });

          return h.x > -50 && !hit;
        });

        // Score
        ctx.fillStyle = 'black';
        ctx.font = 'bold 30px cursive';
        ctx.fillText(`Hearts: ${score} / ${goal}`, 20, 50);

        requestAnimationFrame(loop);
      }

      loop();
    }
  </script>
</body>
</html>
    <h1>Will you keep being my everything? ❤️</h1>
    <p>Forever yours, Mondher</p>
    <!-- Maybe a big heart animation or your photo together -->
  </div>
</div>
