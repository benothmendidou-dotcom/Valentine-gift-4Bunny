<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Password to My Heart 💖</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #c0392b;
      text-align: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      margin: clamp(6px, 3vw, 12px) clamp(10px, 4vw, 20px);
      font-size: clamp(2em, 8vw, 3.2em);
      line-height: 1.1;
      text-shadow: 1px 1px 3px rgba(255,105,180,0.6);
    }
    canvas {
      border: clamp(3px, 1vw, 5px) solid #e74c3c;
      background: #fff0f5;
      border-radius: clamp(12px, 4vw, 20px);
      box-shadow: 0 0 clamp(20px, 6vw, 35px) rgba(231,76,60,0.4);
      display: block;
      margin: clamp(8px, 3vw, 15px) auto;
      max-width: 98%;
      max-height: 82vh; /* much more space on phones */
      touch-action: none;
    }
    #winMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(255,255,255,0.97);
      padding: clamp(30px, 8vw, 50px) clamp(35px, 9vw, 60px);
      border-radius: clamp(20px, 6vw, 32px);
      box-shadow: 0 0 clamp(40px, 10vw, 60px) rgba(255,105,180,0.75);
      font-size: clamp(2em, 7.5vw, 3em);
      line-height: 1.45;
      color: #c0392b;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-out, transform 0.8s ease-out, visibility 0s linear 0.8s;
      z-index: 100;
      max-width: 94%;
      box-sizing: border-box;
    }
    #winMessage.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
      transition-delay: 0s;
    }
    #closeBtn {
      position: absolute;
      top: clamp(8px, 2.5vw, 14px);
      right: clamp(12px, 3.5vw, 18px);
      font-size: clamp(38px, 10vw, 52px);
      font-weight: bold;
      color: #e74c3c;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
      transition: color 0.25s, transform 0.25s;
    }
    #closeBtn:hover {
      color: #c0392b;
      transform: scale(1.3);
    }
  </style>
</head>
<body>
  <h1>Password to My Heart... 💕</h1>
  <canvas id="gameCanvas"></canvas>
  <div id="winMessage">
    <button id="closeBtn">×</button>
    You hit 10 hearts! 🎯<br>
    You already own mine forever ❤️<br>
    I love you so much, [Her Name]!<br>
    Happy Valentine's from Mondher 😘
    <!-- Optional: <img src="images/us-photo.jpg" style="width: clamp(160px, 40vw, 240px); border-radius:15px; margin-top: clamp(15px, 4vw, 25px);"> -->
  </div>

  <script>
    // PASSWORD PROTECTION
    const correctPassword = "iloveyou"; // CHANGE THIS
    let entered = prompt("What's the secret password to my heart? 💖\n(Hint: think of us!)");

    if (entered !== correctPassword) {
      alert("Not quite... try again! 🥺");
      location.reload();
    } else {
      alert("Yes! 💕 Now be Cupid & shoot 10 hearts with taps/drags!");
      startGame();
    }

    function startGame() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const winMsg = document.getElementById('winMessage');

      let hasWon = false; // prevents re-showing after close

      // Responsive canvas – more generous on mobile portrait
      function resize() {
        canvas.width = Math.min(window.innerWidth * 0.98, 800);
        canvas.height = Math.min(window.innerHeight * 0.82, 580);
      }
      resize();
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', resize);

      // CUSTOMIZABLE IMAGES
      const cupidSrc     = 'images/cupid.png';
      const arrowSrc     = 'images/heart-arrow.png';
      const heartSrc     = 'images/target-heart.png';

      const cupidImg = new Image();
      cupidImg.src = cupidSrc;
      cupidImg.onerror = () => console.error("Failed to load Cupid image:", cupidSrc);

      const arrowImg = new Image();
      arrowImg.src = arrowSrc;
      arrowImg.onerror = () => console.error("Failed to load Arrow image:", arrowSrc);

      const heartImg = new Image();
      heartImg.src = heartSrc;
      heartImg.onerror = () => console.error("Failed to load Heart image:", heartSrc);

      let score = 0;
      const goal = 10;
      let arrows = [];
      let hearts = [];

      const cupid = { 
        x: canvas.width * 0.12,  // slightly more left margin on mobile
        y: canvas.height / 2, 
        size: Math.max(70, Math.min(canvas.width * 0.22, 110)) 
      };

      let aim = { x: canvas.width / 2, y: canvas.height / 2 };

      function updateAim(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0]?.clientX);
        const clientY = e.clientY || (e.touches && e.touches[0]?.clientY);
        aim.x = clientX - rect.left;
        aim.y = clientY - rect.top;
      }

      function shoot(e) {
        e.preventDefault();
        updateAim(e);
        const angle = Math.atan2(aim.y - cupid.y, aim.x - (cupid.x + cupid.size));
        const speed = 12;
        arrows.push({
          x: cupid.x + cupid.size,
          y: cupid.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          rotation: angle
        });
      }

      canvas.addEventListener('mousemove', updateAim);
      canvas.addEventListener('mousedown', shoot);
      canvas.addEventListener('touchmove', updateAim, { passive: false });
      canvas.addEventListener('touchstart', shoot, { passive: false });

      class Heart {
        constructor() {
          this.x = canvas.width + 50;
          this.y = Math.random() * (canvas.height - 140) + 70;
          this.size = Math.max(55, Math.min(canvas.width * 0.14, 90));
          this.speed = 2.2 + Math.random() * 3.2;
        }
        update() { this.x -= this.speed; }
        draw() {
          if (heartImg.complete && heartImg.naturalHeight !== 0) {
            ctx.drawImage(heartImg, this.x - this.size/2, this.y - this.size/2, this.size, this.size);
          } else {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.bezierCurveTo(this.x + this.size/2, this.y - this.size/2, this.x + this.size, this.y + this.size/3, this.x, this.y + this.size);
            ctx.bezierCurveTo(this.x - this.size, this.y + this.size/3, this.x - this.size/2, this.y - this.size/2, this.x, this.y);
            ctx.fillStyle = '#ff3366';
            ctx.fill();
          }
        }
      }

      setInterval(() => hearts.push(new Heart()), 1000); // faster spawn for engagement

      document.getElementById('closeBtn').addEventListener('click', () => {
        winMsg.classList.remove('show');
      });

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Cupid
        if (cupidImg.complete && cupidImg.naturalHeight !== 0) {
          ctx.drawImage(cupidImg, cupid.x, cupid.y - cupid.size/2, cupid.size, cupid.size);
        } else {
          ctx.fillStyle = 'pink';
          ctx.fillRect(cupid.x, cupid.y - cupid.size/2, cupid.size, cupid.size);
          ctx.fillStyle = '#ff69b4';
          ctx.beginPath();
          ctx.arc(cupid.x + cupid.size/2, cupid.y - cupid.size/3, cupid.size/4, 0, Math.PI*2);
          ctx.fill();
        }

        // Bow
        ctx.beginPath();
        ctx.moveTo(cupid.x + cupid.size, cupid.y);
        ctx.lineTo(aim.x, aim.y);
        ctx.strokeStyle = 'brown';
        ctx.lineWidth = clamp(4, canvas.width * 0.008, 7);
        ctx.stroke();

        // Arrows
        arrows = arrows.filter(a => {
          a.x += a.vx;
          a.y += a.vy;

          if (arrowImg.complete && arrowImg.naturalHeight !== 0) {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.rotation);
            ctx.drawImage(arrowImg, -30, -15, 60, 30);
            ctx.restore();
          } else {
            ctx.fillStyle = 'red';
            ctx.fillRect(a.x - 15, a.y - 7.5, 40, 15);
          }

          return a.x < canvas.width + 120 && a.y > -60 && a.y < canvas.height + 60;
        });

        // Hearts + collisions
        hearts = hearts.filter(h => {
          h.update();
          h.draw();

          let hit = false;
          arrows.forEach((a, ai) => {
            const dx = a.x - h.x;
            const dy = a.y - h.y;
            if (Math.hypot(dx, dy) < h.size / 1.4) {  // slightly larger hitbox for mobile
              score++;
              hit = true;
              arrows.splice(ai, 1);

              if (score >= goal && !hasWon) {
                hasWon = true;
                winMsg.classList.add('show');
              }
            }
          });

          return h.x > -60 && !hit;
        });

        // Score – larger & nicer on mobile
        ctx.fillStyle = 'black';
        ctx.font = `bold ${Math.max(32, Math.min(canvas.width * 0.08, 48))}px cursive`;
        ctx.fillText(`Hearts: ${score} / ${goal}`, 25, 60);

        requestAnimationFrame(loop);
      }

      loop();
    }
  </script>
</body>
</html>
